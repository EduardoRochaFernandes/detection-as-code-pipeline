# Maps each Sigma rule to the Atomic Red Team test(s) that exercise it, and to
# the captured log fixture used for CI validation. `expects_alert: true` means
# the malicious fixture MUST make the rule fire (true-positive test). The clean
# baseline (tests/fixtures/sample_logs_clean/) is tested separately against ALL
# rules by test_false_positive_baseline.py.
#
# target_host / atomic_test_numbers are what pipeline/run_atomics.py consumes to
# drive the live Windows endpoint; in this fixture-based CI they document
# provenance -- i.e. exactly which atomic produced each captured fixture.

- sigma_rule: t1110_001_brute_force_rdp.yml
  atomic_technique: T1110.001
  atomic_test_numbers: [1]
  target_host: win-endpoint-01
  expects_alert: true

- sigma_rule: t1059_001_suspicious_powershell.yml
  atomic_technique: T1059.001
  atomic_test_numbers: [2, 3]
  target_host: win-endpoint-01
  expects_alert: true

