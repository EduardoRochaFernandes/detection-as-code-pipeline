title: Scheduled Task Creation via schtasks / at
id: 55ad1396-96b8-4f2c-b700-6f990623dd64
status: experimental
description: >
  Detects creation of a scheduled task from the command line via schtasks.exe
  /create or the legacy at.exe. Scheduled tasks are a dual-use persistence and
  execution mechanism heavily abused for both. The rule also flags tasks that
  launch a shell/interpreter, which is a stronger indicator than a benign
  vendor-maintenance task.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: Eduardo Fernandes
date: 2026/07/04
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  schtasks_create:
    Image|endswith:
      - '\schtasks.exe'
      - '\at.exe'
    CommandLine|contains:
      - '/create'
      - '/sc '
  condition: schtasks_create
falsepositives:
  - Legitimate software creating scheduled tasks for updates or maintenance.
  - Administrators scripting routine tasks.
level: medium
