title: LSASS Memory Access / Dump (Credential Dumping)
id: 22d2ab07-68a5-4cf4-afd8-25b9e741ecca
status: experimental
description: >
  Detects attempts to read or dump the memory of the LSASS process, the classic
  path to harvesting cached credentials. Two independent primitives are covered:
  (1) a Sysmon ProcessAccess event (Event ID 10) targeting lsass.exe with a
  GrantedAccess mask that includes PROCESS_VM_READ (0x0010) / 0x1010 / 0x1410,
  and (2) known dumping tools invoked against lsass on the command line
  (procdump -ma lsass, rundll32 comsvcs.dll MiniDump, taskmgr create-dump).
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
author: Eduardo Fernandes
date: 2026/07/04
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  sysmon_lsass_access:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  tool_name:
    CommandLine|contains:
      - 'procdump'
      - 'comsvcs.dll, MiniDump'
      - 'comsvcs.dll,MiniDump'
      - 'MiniDumpWriteDump'
      - 'sekurlsa'
  tool_target_lsass:
    CommandLine|contains: 'lsass'
  condition: sysmon_lsass_access or (tool_name and tool_target_lsass)
falsepositives:
  - Legitimate security products (EDR/AV, backup, crash-dump tooling) that read LSASS memory.
  - Windows Error Reporting generating a legitimate LSASS crash dump.
level: critical
