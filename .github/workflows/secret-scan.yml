name: Secret Scan

# DevSecOps supply-chain hygiene of the project's own pipeline (brief 10.1 / 15):
# fail the build if a secret is ever committed. Closes the loop back to general
# DevSecOps practice and is a second, smaller interview talking point.
on:
  push: {}
  pull_request: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks (full-history scan)
        # Invoked directly rather than via gitleaks/gitleaks-action@v2: that
        # action diffs push before..after SHAs, which errors on a repo's very
        # first push (the root commit has no parent, so "<root>^" is an
        # invalid revision). Scanning full history directly avoids that edge
        # case and is equally strict.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git=false --redact -v
